<script>
    // 從首頁複製的導覽列相關常數 (路徑修正為 '../../')
        const INDEX_PAGE_URL = '../../index.html'; // **[新增]** 補上首頁 URL
        const LOGIN_PAGE_URL = '../auth/login.html';
        const MEMBER_HOME_URL = '../member/member_home.html';

        /**
         * 渲染未登入狀態的導覽列。
         */
        function renderLoggedOutState() {
            const headerNavRight = document.getElementById('headerNavRight');
            if (!headerNavRight) return;
            
            // 獲取當前頁面的完整 URL，並進行 URL 編碼
            const currentUrl = encodeURIComponent(window.location.href);

            // 構造帶有回調網址的登入連結
            const loginRedirectUrl = `${LOGIN_PAGE_URL}?redirect=${currentUrl}`;
            
            // 渲染導覽列：登入 + 會員中心
            headerNavRight.innerHTML = `
                <a href="${loginRedirectUrl}" class="hover:text-vieshow-gold transition duration-300">登入</a>
                <a href="${MEMBER_HOME_URL}" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            `;
        }

        /**
         * 渲染已登入狀態的導覽列。
         */
        function renderLoggedInState() {
            const headerNavRight = document.getElementById('headerNavRight');
            if (!headerNavRight) return;

            // 渲染導覽列：登出 + 會員中心
            headerNavRight.innerHTML = `
                <a href="#" id="signOutLink" class="hover:text-vieshow-gold transition duration-300">登出</a>
                <a href="${MEMBER_HOME_URL}" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            `;
            
            // 綁定登出事件
            document.getElementById('signOutLink')?.addEventListener('click', handleSignOut);
        }

        /**
         * 處理登出邏輯。
         */
        function handleSignOut(e) {
            e.preventDefault();

            // 1. 清除登入狀態的關鍵步驟
            localStorage.removeItem('auth_token');
            localStorage.removeItem('isLoggedIn');

            // 2. 顯示登出訊息 (使用自定義 alert)
            // 將跳轉邏輯作為回呼函數傳入
            alert('您已成功登出。即將導向首頁...', () => {
                // 3. 延遲導向首頁 (在用戶點擊 Modal 確認後 2 秒執行)
                setTimeout(() => {
                    window.location.href = INDEX_PAGE_URL;
                }, 2000);
            }); 
            // alert('您已成功登出。即將重新整理頁面...', () => {
            //     // 3. 延遲導向當前頁面
            //     setTimeout(() => {
            //         // *** 關鍵修正：重新載入當前頁面，而不是跳回首頁 ***
            //         window.location.href = window.location.href; 
            //     }, 2000);
            // });
            
            // 4. 重新渲染導覽列至未登入狀態 (必須在跳轉前執行)
            renderUI();
        }

        /**
         * 檢查登入狀態並渲染 UI
         */
        function renderUI() {
            // 模擬：如果 localStorage 中有 'auth_token' 則視為已登入
            const token = localStorage.getItem('auth_token');
            if (token) {
                renderLoggedInState(); 
            } else {
                renderLoggedOutState();
            }
        }

        // 3. 統一的自定義 Alert 函數
        // ----------------------------------------------------

        /**
         * 自定義 Modal 警告框，並接受一個點擊確認後執行的 callback 函數。
         * @param {string} message - 顯示的訊息。
         * @param {function} [callback] - 用戶點擊「確認」後要執行的函數 (可選)。
         */
        function customAlert(message, callback) { 
            const existingModal = document.getElementById('custom-alert-modal');
            if (existingModal) existingModal.remove();

            // 處理點擊「確認」的邏輯
            const handleConfirm = () => {
                document.getElementById('custom-alert-modal').remove();
                // 只有在用戶點擊確認後，才執行傳入的 callback 函數
                if (callback && typeof callback === 'function') {
                    callback(); 
                }
            };

            // 將 handleConfirm 函數註冊到全域，確保 HTML onclick 可以找到它
            window.customAlertConfirm = handleConfirm;


            const modalHtml = `
                <div id="custom-alert-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm transform scale-100 transition-all duration-300">
                        <div class="text-xl font-bold text-gray-900 mb-3 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-vieshow-red mr-2" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                            系統提示
                        </div>
                        <p class="text-gray-700 mb-5">${message}</p>
                        <div class="flex justify-end">
                            <button onclick="window.customAlertConfirm()" 
                                    class="bg-vieshow-red hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-vieshow-red focus:ring-offset-2">
                                確認
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        // 覆寫瀏覽器內建的 alert，統一使用 customAlert
        window.alert = customAlert;

        // 導覽列邏輯結束

    function setupLoginRedirectLink() {
        const loginButton = document.getElementById('loginRedirectButton');
        
        if (loginButton) {
            // 1. 獲取相對於專案根目錄的路徑 (例如：booking/booking_flow.html?...)
            const pathname = window.location.pathname;
            let relativeToRootPath = (pathname.startsWith('/') ? pathname.substring(1) : pathname) + window.location.search; 
            
            const encodedPath = encodeURIComponent(relativeToRootPath);

            // 2. 構造目標跳轉網址：指向 login.html，並在 redirect 參數中傳遞相對路徑
            // 登入頁的路徑 (LOGIN_PAGE_URL) 應根據當前頁面 (booking/booking_flow.html) 來確定
            // 從 booking/ -> auth/login.html 的路徑是 '../auth/login.html'
            
            const LOGIN_PAGE_URL_FIXED = '../auth/login.html'; // 假設是這個路徑
            
            // 3. 賦值給按鈕的 href
            loginButton.href = `${LOGIN_PAGE_URL_FIXED}?redirect=${encodedPath}`;
            
            console.log("已修正登入按鈕連結:", loginButton.href);
        }
    }

    // 初始渲染 UI 狀態
    // 確保在頁面初始化時執行這個函式
    document.addEventListener('DOMContentLoaded', () => {
        renderUI();
        
        setupLoginRedirectLink(); // ✨ 執行路徑修正

    });
    
    // 步驟 0: 檢查登入狀態
    // 確保您已宣告相關 DOM 元素，這裡只需要 loginOverlay
    const loginOverlay = document.getElementById('loginOverlay');
    // 假設您的主要訂票表單內容在 <main> 標籤中
    const mainContent = document.querySelector('main'); 


    function checkLoginStatus() {
        // 模擬登入狀態：檢查 localStorage 中是否有 'isLoggedIn' 資料
        const token = localStorage.getItem('auth_token');
        if (!token) {
            // 未登入處理：顯示圖層，隱藏主要內容
            if (loginOverlay) {
                loginOverlay.classList.remove('hidden');
            }
            if (mainContent) {
                // 避免使用者看到被遮蓋的內容
                mainContent.classList.add('hidden'); 
            }
            
            // 阻止後續的訂票初始化流程
            return false;
        }

        // 已登入處理：確保圖層隱藏，主要內容顯示
        if (loginOverlay) {
            loginOverlay.classList.add('hidden');
        }
        if (mainContent) {
            mainContent.classList.remove('hidden');
        }
        
        return true;
    }
    let currentBooking = {};

    // 安全導頁
    function safeNavigate(fileName) {
        try {
            window.location.href = fileName;
        } catch (e) {
            const currentPath = window.location.href;
            const dirPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
            window.location.href = dirPath + fileName;
        }
    }

    // 動態產生付款表單
    function renderPaymentFields(method) {
        const fields = document.getElementById("paymentFields");
        
        if (method === "credit_card") {
            document.getElementById("paymentMethodDisplay").textContent = "信用卡/金融卡";
            
            fields.innerHTML = `
                <div>
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <span class="mr-2">💳</span> 信用卡資訊
                    </h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">持卡人姓名</label>
                            <input type="text" id="card_name" required placeholder="請輸入與卡片一致的中文姓名" 
                                   class="form-input" maxlength="30">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">信用卡號碼</label>
                            <div class="relative">
                                <input type="text" id="card_number" required placeholder="xxxx xxxx xxxx xxxx" 
                                       class="form-input pr-12" maxlength="19" inputmode="numeric">
                                <div class="absolute right-3 top-3 flex space-x-1">
                                    <div class="card-icon">💳</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">有效期限</label>
                                <input type="text" id="expiry_date" required placeholder="MM/YY" 
                                       class="form-input" maxlength="5">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">安全碼 (CVV)</label>
                                <input type="text" id="cvv" required placeholder="卡片背面3碼" 
                                       class="form-input" maxlength="3" inputmode="numeric">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // 添加信用卡號碼格式化
            setupCardNumberFormatting();
            setupExpiryDateFormatting();
        }

        if (method === "line_pay") {
            document.getElementById("paymentMethodDisplay").textContent = "Line Pay";

            const tx = currentBooking.payment_info?.linepay_tx || '未提供';
            fields.innerHTML = `
                <div>
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <span class="mr-2">💚</span> Line Pay 付款
                    </h3>

                    <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                        <p class="text-sm text-green-700">請於上一頁使用 Line Pay 掃描 QR 並完成付款。完成後回到此頁按下「我已完成付款」。</p>
                    </div>

                    <div>
                        <p class="small muted">交易識別碼</p>
                        <p class="font-semibold" id="linepay_tx_display">${tx}</p>
                    </div>

                    <div style="margin-top:.5rem;">
                        <button type="button" id="confirmLinePayBtn" class="btn-outline">我已完成付款</button>
                    </div>
                </div>
            `;

            // attach confirm handler
            setTimeout(() => {
                const confirmBtn = document.getElementById('confirmLinePayBtn');
                if (confirmBtn) confirmBtn.addEventListener('click', function(){
                    // finalize by completing order processing
                    completeOrderProcessing();
                });
            }, 0);
        }

        if (method === "jkopay") {
            document.getElementById("paymentMethodDisplay").textContent = "街口支付";
            
            fields.innerHTML = `
                <div>
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <span class="mr-2">🟣</span> 街口支付
                    </h3>
                    
                    <div class="bg-purple-50 border border-purple-200 rounded-lg p-4 mb-4">
                        <p class="text-sm text-purple-700">
                            確認付款後將顯示街口支付 QR Code，請使用街口支付 App 掃碼完成付款
                        </p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">手機號碼</label>
                        <input type="tel" id="phone" required placeholder="用來接收付款通知的手機號碼" 
                               class="form-input" pattern="[0-9]{10}">
                    </div>
                </div>
            `;
        }
    }

    // 信用卡號碼格式化
    function setupCardNumberFormatting() {
        const cardNumberInput = document.getElementById('card_number');
        if (cardNumberInput) {
            cardNumberInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
                let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
                e.target.value = formattedValue;
            });
        }
    }

    // 有效期限格式化
    function setupExpiryDateFormatting() {
        const expiryInput = document.getElementById('expiry_date');
        if (expiryInput) {
            expiryInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length >= 2) {
                    value = value.substring(0, 2) + '/' + value.substring(2, 4);
                }
                e.target.value = value;
            });
        }
    }

    // 載入訂單資料
    function loadBookingData() {
        const stored = localStorage.getItem("currentBooking");

        if (!stored) {
            console.warn("沒有 currentBooking → 返回 Step5");
            safeNavigate("booking_flow_5.html");
            return;
        }

        try {
            currentBooking = JSON.parse(stored);
            console.log('載入訂單資料:', currentBooking);
        } catch (e) {
            console.error('解析訂單資料失敗:', e);
            safeNavigate("booking_flow_5.html");
            return;
        }

        // 資料驗證
        if (currentBooking.totalPrice == null || !currentBooking.payment_method) {
            console.error("資料不完整 → 返回 Step5");
            safeNavigate("booking_flow_5.html");
            return;
        }

        // 顯示訂單摘要
        document.getElementById("movieTitle").textContent = currentBooking.movie?.title || currentBooking.movieTitle || "未選擇";
        
        if (currentBooking.showtime) {
            const showtime = currentBooking.showtime;
            document.getElementById("showtimeDetails").textContent = 
                `${showtime.date} ${showtime.time} ${showtime.theater}`;
        } else {
            document.getElementById("showtimeDetails").textContent = currentBooking.showtimeDetail || "未選擇";
        }
        
        document.getElementById("selectedSeats").textContent = currentBooking.selectedSeats ? 
            currentBooking.selectedSeats.join('、') : "未選擇";

        // 顯示金額明細
        const totalPrice = currentBooking.totalPrice || 0;
        const ticketPrice = currentBooking.totalTicketPrice || 0;
        const foodPrice = currentBooking.totalComboPrice || 0;

        document.getElementById("ticketAmount").textContent = `NT$ ${ticketPrice.toLocaleString('en-US')}`;
        document.getElementById("foodAmount").textContent = `NT$ ${foodPrice.toLocaleString('en-US')}`;
        document.getElementById("displayTotalAmount").textContent = totalPrice.toLocaleString('en-US');

        // 渲染付款表單
        renderPaymentFields(currentBooking.payment_method);
        // no inline QR/email generation here; QR is generated in step 5 when selecting Line Pay
    }

    // 顯示錯誤訊息
    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        errorText.textContent = message;
        errorDiv.classList.remove('hidden');
    }

    // 隱藏錯誤訊息
    function hideError() {
        document.getElementById('errorMessage').classList.add('hidden');
    }

    // 表單提交
    document.getElementById("paymentDetailForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        hideError();

        // 檢查服務條款同意
        if (!document.getElementById('agreeTerms').checked) {
            showError('請同意服務條款及隱私權政策');
            return;
        }

        // 表單驗證
        if (!this.checkValidity()) {
            showError('請填寫所有必填欄位');
            return;
        }

        // 顯示載入狀態
        const submitButton = this.querySelector('button[type="submit"]');
        const submitText = document.getElementById('submitButtonText');
        const spinner = document.getElementById('loadingSpinner');
        
        submitText.textContent = '付款處理中...';
        spinner.classList.remove('hidden');
        submitButton.disabled = true;

        try {
            // 如果使用 Line Pay，改為產生 QR 並顯示給使用者掃碼（不自動完成訂單）
            if (currentBooking.payment_method === 'line_pay') {
                const email = document.getElementById('email')?.value || '';
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showError('請輸入有效的電子信箱以接收付款通知');
                    submitButton.disabled = false;
                    submitText.textContent = '確認付款並送出訂單';
                    spinner.classList.add('hidden');
                    return;
                }

                // 儲存暫時的付款資訊
                currentBooking.payment_info = currentBooking.payment_info || {};
                currentBooking.payment_info.linepay_email = email;

                // 產生並顯示 QR
                generateLinePayQR(email);

                // 顯示 linePayArea
                const area = document.getElementById('linePayArea');
                if (area) area.classList.remove('hidden');

                // 讓按鈕改回可按，等待使用者點選「我已完成付款」
                submitText.textContent = '請使用 Line Pay 掃碼付款';
                spinner.classList.add('hidden');
                submitButton.disabled = false;
                return; // 停止後續自動完成流程，等待使用者確認
            }

            // 模擬線上付款處理時間
            await new Promise(resolve => setTimeout(resolve, 1200));

            // 更新訂單狀態
            completeOrderProcessing();

        } catch (error) {
            console.error('付款處理失敗:', error);
            showError('付款處理失敗，請稍後再試');
            
            // 恢復按鈕狀態
            submitText.textContent = '確認付款並送出訂單';
            spinner.classList.add('hidden');
            submitButton.disabled = false;
        }
    });

    // 頁面載入
    window.onload = function() {
        loadBookingData();
    };

    /* Line Pay QR/email generation and finalize functions removed.
       QR is now generated in booking_flow_5 and booking_flow_6 only provides a confirm button. */

    function completeOrderProcessing() {
        currentBooking.status = "COMPLETED";
        currentBooking.paid_at = new Date().toISOString();
        currentBooking.order_id = 'VS' + Date.now().toString().slice(-8);

        if (currentBooking.payment_method === 'credit_card') {
            currentBooking.payment_info = currentBooking.payment_info || {};
            currentBooking.payment_info.card_last4 = document.getElementById('card_number')?.value.slice(-4) || '';
            currentBooking.payment_info.card_type = 'credit_card';
        }

        localStorage.setItem("lastCompletedBooking", JSON.stringify(currentBooking));
        localStorage.removeItem("currentBooking");
        console.log("✅ 付款完成：", currentBooking);
        safeNavigate("booking_complete.html");
    }

    // Escape helper for simple text
    function escapeHtml(str) {
        return String(str).replace(/[&<>\"'`]/g, function (s) {
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;","`":"&#96;"})[s];
        });
    }
</script>

<footer class="bg-vieshow-dark text-white text-center py-4 mt-8 shadow-inner">
    <p>&copy; 2025 Vieshow Ticketing System</p>
</footer>
