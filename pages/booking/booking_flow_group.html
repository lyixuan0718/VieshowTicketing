<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團體訂票 團體票與聯絡資訊 - Vieshow Ticketing</title>

    <!-- 使用共用 CSS -->
    <link rel="stylesheet" href="../../public/assets/css/booking_flow.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <header class="bg-vieshow-dark text-white shadow-md sticky top-0 z-10">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../../index.html" class="text-xl font-bold hover:text-vieshow-gold transition duration-300 flex items-center">
                <span class="mr-2">🎬</span> Vieshow 影城
            </a>
            <div class="space-x-4">
                <a href="../auth/login.html" class="hover:text-vieshow-gold transition duration-300">登入</a>
                <a href="../member/member_home.html" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            </div>
        </nav>
    </header>

    <div class="container mx-auto px-4 py-8 flex-grow max-w-4xl">
        <div class="step-indicator">
            <div class="step-circle step-completed">1</div>
            <div class="step-line step-active"></div>
            <div class="step-circle step-active">2</div>
            <div class="step-line step-pending"></div>
            <div class="step-circle step-pending">3</div>
            <div class="step-line step-pending"></div>
            <div class="step-circle step-pending">4</div>
            <div class="step-line step-pending"></div>
            <div class="step-circle step-pending">5</div>
        </div>

        <div id="bookingCard" class="booking-card">
            <div class="title-section">
                <h1 class="main-title">🎟️ 團體訂票</h1>
                <p class="step-title"> 填寫團體資訊與票數</p>
                <p class="step-description">您選擇了團體票，請填寫團體人數與聯絡資訊，我們將協助安排。</p>
            </div>

            <form id="groupBookingForm" action="#" method="POST" class="form-section">
                <div class="section-label">團體資訊</div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">聯絡人姓名</label>
                    <input id="contactName" name="contactName" class="select-styled" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">聯絡電話</label>
                    <input id="contactPhone" name="contactPhone" class="select-styled" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">團體人數 (10 人以上)</label>
                    <input id="groupSize" name="groupSize" type="number" min="10" class="select-styled" value="10" required>
                    <p class="select-help">輸入團體人數，我們會根據人數協助安排座位與報價。</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">備註 (可選)</label>
                    <textarea id="groupNote" name="groupNote" class="select-styled" rows="3"></textarea>
                </div>

                <div class="button-container">
                    <a href="booking_flow_1.html" class="next-step-button" style="background:#6b7280;text-align:center;text-decoration:none;">回上一步</a>
                    <button type="submit" id="groupNextButton" class="next-step-button">下一步: 確認座位與付款 (步驟 3)</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 團體訂票表單提交：保存資料到 localStorage 並跳轉
        // 定義成人票基準價格（若未由外部提供，使用預設值）
        const ADULT_BASE_PRICE = 320; // TWD

        document.getElementById('groupBookingForm').addEventListener('submit', function(e){
            e.preventDefault();
            const contactName = document.getElementById('contactName').value;
            const contactPhone = document.getElementById('contactPhone').value;
            const groupSize = parseInt(document.getElementById('groupSize').value || '0', 10);
            const note = document.getElementById('groupNote').value;

            if(!contactName || !contactPhone || groupSize < 10){
                alert('請確認已填寫聯絡資訊與團體人數 (至少 10 人)。');
                return;
            }

            const prev = JSON.parse(localStorage.getItem('currentBooking') || '{}');
            // 合併先前的選擇並加入團體資料與票數
            const data = {
                ...prev,
                ticketType: 'group',
                groupInfo: { contactName, contactPhone, groupSize, note },
                // 將團體人數預設為欲購票張數（可在步驟3由使用者調整）
                totalTicketQty: groupSize,
                // 計算團體票價格：以一般成人票為基準，團體票享 75%（即 25% 折扣）
                tickets: prev.tickets || {
                    'group_full': { name: '團體票 (成人價 75%)', quantity: groupSize, price: Math.round(ADULT_BASE_PRICE * 0.75) }
                },
                combos: prev.combos || {},
                totalPrice: prev.totalPrice || (Math.round(ADULT_BASE_PRICE * 0.75) * groupSize)
            };

            localStorage.setItem('currentBooking', JSON.stringify(data));
            // 前往下一步（座位選擇）
            window.location.href = 'booking_flow_3.html';
        });
    </script>

    <footer>
        <p>&copy; 2025 Vieshow Ticketing System - 團體訂票 步驟 2</p>
    </footer>
</body>
</html>
