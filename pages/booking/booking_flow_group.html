<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團體訂票 團體票與聯絡資訊 - Vieshow Ticketing</title>

    <!-- 使用共用 CSS -->
    <link rel="stylesheet" href="../../public/assets/css/booking_flow.css">
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // Tailwind 配置，確保顏色和字體與專案一致
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vieshow-red': '#e50914',
                        'vieshow-gold': '#f7a83d',
                        'vieshow-dark': '#1a1a1a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- <header class="bg-vieshow-dark text-white shadow-md sticky top-0 z-10">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../../index.html" class="text-xl font-bold hover:text-vieshow-gold transition duration-300 flex items-center">
                <span class="mr-2">🎬</span> Vieshow 影城
            </a>
            <div class="space-x-4">
                <a href="../auth/login.html" class="hover:text-vieshow-gold transition duration-300">登入</a>
                <a href="../member/member_home.html" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            </div>

    </header> -->
    <header class="bg-gray-800 text-white shadow-md">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../../index.html" class="text-xl font-bold hover:text-vieshow-red transition duration-300">Vieshow 影城</a>
            <div id="headerNavRight" class="space-x-4">
            </div>
        </nav>
    </header>

    <div id="loginOverlay" class="hidden">
        <div class="login-prompt-content">
            <h2>
                <i class="fas fa-lock" style="margin-right: 0.5rem;"></i>
                請先登入才能進行訂票
            </h2>
            <p>
                請點擊下方按鈕前往登入頁面，以便繼續您的訂票流程。
            </p>
            <a href="javascript:void(0)" id="loginRedirectButton" class="btn primary-btn" style="margin-top: 1rem; display: inline-block; padding: 0.5rem 1rem; background-color: #1f2937; color: #fff; border-radius: 0.5rem; text-decoration: none;">
                前往登入
            </a>
        </div>
    </div>


    <div class="container mx-auto px-4 py-8 flex-grow max-w-4xl">
        <div class="step-indicator">
            <div class="step-circle step-completed">1</div>
            <div class="step-line step-active"></div>
            <div class="step-circle step-active">2</div>
            <div class="step-line step-pending"></div>
            <div class="step-circle step-pending">3</div>
            <div class="step-line step-pending"></div>
            <div class="step-circle step-pending">4</div>
            <div class="step-line step-pending"></div>
            <div class="step-circle step-pending">5</div>
        </div>

        <div id="bookingCard" class="booking-card">
            <div class="title-section">
                <h1 class="main-title">🎟️ 團體訂票</h1>
                <p class="step-title"> 填寫團體資訊與票數</p>
                <p class="step-description">您選擇了團體票，請填寫團體人數與聯絡資訊，我們將協助安排。</p>
            </div>

            <form id="groupBookingForm" action="#" method="POST" class="form-section">
                <div class="section-label">團體資訊</div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">聯絡人姓名</label>
                    <input id="contactName" name="contactName" class="select-styled" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">聯絡電話</label>
                    <input id="contactPhone" name="contactPhone" class="select-styled" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">團體人數 (10 人以上)</label>
                    <input id="groupSize" name="groupSize" type="number" min="10" class="select-styled" value="10" required>
                    <p class="select-help">輸入團體人數，我們會根據人數協助安排座位與報價。</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">備註 (可選)</label>
                    <textarea id="groupNote" name="groupNote" class="select-styled" rows="3"></textarea>
                </div>

                <div class="button-container">
                    <a href="booking_flow_1.html" class="next-step-button" style="background:#6b7280;text-align:center;text-decoration:none;">回上一步</a>
                    <button type="submit" id="groupNextButton" class="next-step-button">下一步: 確認座位與付款 (步驟 3)</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 從首頁複製的導覽列相關常數 (路徑修正為 '../../')
        const INDEX_PAGE_URL = '../../index.html'; // **[新增]** 補上首頁 URL
        const LOGIN_PAGE_URL = '../auth/login.html';
        const MEMBER_HOME_URL = '../member/member_home.html';

        /**
         * 渲染未登入狀態的導覽列。
         */
        function renderLoggedOutState() {
            const headerNavRight = document.getElementById('headerNavRight');
            if (!headerNavRight) return;
            
            // 獲取當前頁面的完整 URL，並進行 URL 編碼
            const currentUrl = encodeURIComponent(window.location.href);

            // 構造帶有回調網址的登入連結
            const loginRedirectUrl = `${LOGIN_PAGE_URL}?redirect=${currentUrl}`;
            
            // 渲染導覽列：登入 + 會員中心
            headerNavRight.innerHTML = `
                <a href="${loginRedirectUrl}" class="hover:text-vieshow-gold transition duration-300">登入</a>
                <a href="${MEMBER_HOME_URL}" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            `;
        }

        /**
         * 渲染已登入狀態的導覽列。
         */
        function renderLoggedInState() {
            const headerNavRight = document.getElementById('headerNavRight');
            if (!headerNavRight) return;

            // 渲染導覽列：登出 + 會員中心
            headerNavRight.innerHTML = `
                <a href="#" id="signOutLink" class="hover:text-vieshow-gold transition duration-300">登出</a>
                <a href="${MEMBER_HOME_URL}" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            `;
            
            // 綁定登出事件
            document.getElementById('signOutLink')?.addEventListener('click', handleSignOut);
        }

        /**
         * 處理登出邏輯。
         */
        function handleSignOut(e) {
            e.preventDefault();

            // 1. 清除登入狀態的關鍵步驟
            localStorage.removeItem('auth_token');
            localStorage.removeItem('isLoggedIn');

            // 2. 顯示登出訊息 (使用自定義 alert)
            // 將跳轉邏輯作為回呼函數傳入
            alert('您已成功登出。即將導向首頁...', () => {
                // 3. 延遲導向首頁 (在用戶點擊 Modal 確認後 2 秒執行)
                setTimeout(() => {
                    window.location.href = INDEX_PAGE_URL;
                }, 2000);
            }); 
            // alert('您已成功登出。即將重新整理頁面...', () => {
            //     // 3. 延遲導向當前頁面
            //     setTimeout(() => {
            //         // *** 關鍵修正：重新載入當前頁面，而不是跳回首頁 ***
            //         window.location.href = window.location.href; 
            //     }, 2000);
            // });
            
            // 4. 重新渲染導覽列至未登入狀態 (必須在跳轉前執行)
            renderUI();
        }

        /**
         * 檢查登入狀態並渲染 UI
         */
        function renderUI() {
            // 模擬：如果 localStorage 中有 'auth_token' 則視為已登入
            const token = localStorage.getItem('auth_token');
            if (token) {
                renderLoggedInState(); 
            } else {
                renderLoggedOutState();
            }
        }

        // 3. 統一的自定義 Alert 函數
        // ----------------------------------------------------

        /**
         * 自定義 Modal 警告框，並接受一個點擊確認後執行的 callback 函數。
         * @param {string} message - 顯示的訊息。
         * @param {function} [callback] - 用戶點擊「確認」後要執行的函數 (可選)。
         */
        function customAlert(message, callback) { 
            const existingModal = document.getElementById('custom-alert-modal');
            if (existingModal) existingModal.remove();

            // 處理點擊「確認」的邏輯
            const handleConfirm = () => {
                document.getElementById('custom-alert-modal').remove();
                // 只有在用戶點擊確認後，才執行傳入的 callback 函數
                if (callback && typeof callback === 'function') {
                    callback(); 
                }
            };

            // 將 handleConfirm 函數註冊到全域，確保 HTML onclick 可以找到它
            window.customAlertConfirm = handleConfirm;


            const modalHtml = `
                <div id="custom-alert-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm transform scale-100 transition-all duration-300">
                        <div class="text-xl font-bold text-gray-900 mb-3 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-vieshow-red mr-2" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                            系統提示
                        </div>
                        <p class="text-gray-700 mb-5">${message}</p>
                        <div class="flex justify-end">
                            <button onclick="window.customAlertConfirm()" 
                                    class="bg-vieshow-red hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-vieshow-red focus:ring-offset-2">
                                確認
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        // 覆寫瀏覽器內建的 alert，統一使用 customAlert
        window.alert = customAlert;

        // 導覽列邏輯結束

    function setupLoginRedirectLink() {
        const loginButton = document.getElementById('loginRedirectButton');
        
        if (loginButton) {
            // 1. 獲取相對於專案根目錄的路徑 (例如：booking/booking_flow.html?...)
            const pathname = window.location.pathname;
            let relativeToRootPath = (pathname.startsWith('/') ? pathname.substring(1) : pathname) + window.location.search; 
            
            const encodedPath = encodeURIComponent(relativeToRootPath);

            // 2. 構造目標跳轉網址：指向 login.html，並在 redirect 參數中傳遞相對路徑
            // 登入頁的路徑 (LOGIN_PAGE_URL) 應根據當前頁面 (booking/booking_flow.html) 來確定
            // 從 booking/ -> auth/login.html 的路徑是 '../auth/login.html'
            
            const LOGIN_PAGE_URL_FIXED = '../auth/login.html'; // 假設是這個路徑
            
            // 3. 賦值給按鈕的 href
            loginButton.href = `${LOGIN_PAGE_URL_FIXED}?redirect=${encodedPath}`;
            
            console.log("已修正登入按鈕連結:", loginButton.href);
        }
    }

    // 初始渲染 UI 狀態
    // 確保在頁面初始化時執行這個函式
    document.addEventListener('DOMContentLoaded', () => {
        renderUI();
        
        setupLoginRedirectLink(); // ✨ 執行路徑修正

    });
    
    // 步驟 0: 檢查登入狀態
    // 確保您已宣告相關 DOM 元素，這裡只需要 loginOverlay
    const loginOverlay = document.getElementById('loginOverlay');
    // 假設您的主要訂票表單內容在 <main> 標籤中
    const mainContent = document.querySelector('main'); 


    function checkLoginStatus() {
        // 模擬登入狀態：檢查 localStorage 中是否有 'isLoggedIn' 資料
        const token = localStorage.getItem('auth_token');
        if (!token) {
            // 未登入處理：顯示圖層，隱藏主要內容
            if (loginOverlay) {
                loginOverlay.classList.remove('hidden');
            }
            if (mainContent) {
                // 避免使用者看到被遮蓋的內容
                mainContent.classList.add('hidden'); 
            }
            
            // 阻止後續的訂票初始化流程
            return false;
        }

        // 已登入處理：確保圖層隱藏，主要內容顯示
        if (loginOverlay) {
            loginOverlay.classList.add('hidden');
        }
        if (mainContent) {
            mainContent.classList.remove('hidden');
        }
        
        return true;
    }
        // 團體訂票表單提交：保存資料到 localStorage 並跳轉
        // 定義成人票基準價格（若未由外部提供，使用預設值）
        const ADULT_BASE_PRICE = 320; // TWD

        document.getElementById('groupBookingForm').addEventListener('submit', function(e){
            e.preventDefault();
            const contactName = document.getElementById('contactName').value;
            const contactPhone = document.getElementById('contactPhone').value;
            const groupSize = parseInt(document.getElementById('groupSize').value || '0', 10);
            const note = document.getElementById('groupNote').value;

            if(!contactName || !contactPhone || groupSize < 10){
                alert('請確認已填寫聯絡資訊與團體人數 (至少 10 人)。');
                return;
            }

            const prev = JSON.parse(localStorage.getItem('currentBooking') || '{}');
            // 合併先前的選擇並加入團體資料與票數
            const data = {
                ...prev,
                ticketType: 'group',
                groupInfo: { contactName, contactPhone, groupSize, note },
                // 將團體人數預設為欲購票張數（可在步驟3由使用者調整）
                totalTicketQty: groupSize,
                // 計算團體票價格：以一般成人票為基準，團體票享 75%（即 25% 折扣）
                tickets: prev.tickets || {
                    'group_full': { name: '團體票 (成人價 75%)', quantity: groupSize, price: Math.round(ADULT_BASE_PRICE * 0.75) }
                },
                combos: prev.combos || {},
                totalPrice: prev.totalPrice || (Math.round(ADULT_BASE_PRICE * 0.75) * groupSize)
            };

            localStorage.setItem('currentBooking', JSON.stringify(data));
            // 前往下一步（座位選擇）
            window.location.href = 'booking_flow_3.html';
        });
    </script>

    <footer class="bg-vieshow-dark text-white text-center py-4 mt-8 shadow-inner">
        <p>&copy; 2025 Vieshow Ticketing System</p>
    </footer>
</body>
</html>
