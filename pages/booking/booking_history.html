        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vieshow-red': '#e50914',
                        'vieshow-gold': '#f7a83d',
                        'vieshow-dark': '#1a1a1a',

                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],

        /* 動畫效果 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes fadeOutUp {
            from { opacity: 1; transform: translate(-50%, 0); }
            to { opacity: 0; transform: translate(-50%, -20px); }
        }
        .animate-fade-in-down { animation: fadeInDown 0.5s ease-out forwards; }
        .animate-fade-out-up { animation: fadeOutUp 0.5s ease-in forwards; }
        
        /* 載入動畫 */
        .loading-spinner {
            width: 2rem; /* 8 */
            height: 2rem; /* 8 */
            border-width: 4px;
            border-style: solid;
            border-color: rgba(247,168,61,1); /* vieshow-gold */
            border-top-color: transparent;
            border-radius: 9999px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 卡片懸停效果 */
        .order-card {
            transition: all 300ms ease;
        }
        .order-card:hover {
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            transform: scale(1.02);
        }
    </style>

    <!-- JavaScript 邏輯 -->
    <script>
        // 1. 頁面路徑常數定義
        // ----------------------------------------------------
        const LOGIN_PAGE_URL = '../auth/login.html';
        const MEMBER_HOME_URL = '../member/member_home.html';
        const INDEX_PAGE_URL = '../../index.html';

        // ----------------------------------------------------
        // 2. 核心函數：登入/登出狀態渲染
        // ----------------------------------------------------

        function renderLoggedOutState() {
            const headerNavRight = document.getElementById('headerNavRight');
            if (!headerNavRight) return;
            headerNavRight.innerHTML = `
                <a href="${LOGIN_PAGE_URL}" class="hover:text-vieshow-gold transition duration-300">登入</a>
                <a href="${MEMBER_HOME_URL}" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            `;
        }

        function renderLoggedInState() {
            const headerNavRight = document.getElementById('headerNavRight');
            if (!headerNavRight) return;

            headerNavRight.innerHTML = `
                <a href="#" id="signOutLink" class="hover:text-vieshow-gold transition duration-300">登出</a>
                <a href="${MEMBER_HOME_URL}" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            `;
            
            document.getElementById('signOutLink')?.addEventListener('click', handleSignOut);
        }

        /**
         * 【***修正區塊 1/2***】處理登出邏輯，將動作延遲到 customAlert 的 callback 中。
         */
        function handleSignOut(e) {
            e.preventDefault();
            
            // 由於清除 token 和跳轉必須在用戶按「確認」後才執行
            const signOutCallback = () => {
                // 1. 清除登入狀態
                localStorage.removeItem('auth_token');

                // 2. 延遲導向首頁
                setTimeout(() => {
                    window.location.href = INDEX_PAGE_URL;
                }, 2000);

                // 立即更新 UI 狀態
                renderUI(); 
            };

            // 顯示登出訊息，並將包含清除 token 和跳轉的函數作為 callback 傳入
            customAlert('您已成功登出。即將導向首頁...', signOutCallback); 
        }

        function renderUI() {
            const token = localStorage.getItem('auth_token');

            if (token) {
                renderLoggedInState(); 
            } else {
                renderLoggedOutState(); 
            }
        }


        // ----------------------------------------------------
        // 3. 【***修正區塊 2/2***】統一的自定義 Alert 函數 (新增 callback 支援)
        // ----------------------------------------------------

        /**
         * 自定義 Modal 警告框，並接受一個點擊確認後執行的 callback 函數。
         * @param {string} message - 顯示的訊息。
         * @param {function} [callback] - 用戶點擊「確認」後要執行的函數 (可選)。
         */
        function customAlert(message, callback) { 
            const existingModal = document.getElementById('custom-alert-modal');
            if (existingModal) existingModal.remove();

            // 處理點擊「確認」的邏輯
            const handleConfirm = () => {
                document.getElementById('custom-alert-modal').remove();
                // 只有在用戶點擊確認後，才執行傳入的 callback 函數
                if (callback && typeof callback === 'function') {
                    callback(); 
                }
            };

            // 將 handleConfirm 函數註冊到全域，確保 HTML onclick 可以找到它
            window.customAlertConfirm = handleConfirm;


            const modalHtml = `
                <div id="custom-alert-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm transform scale-100 transition-all duration-300">
                        <div class="text-xl font-bold text-gray-900 mb-3 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-vieshow-red mr-2" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                            系統提示
                        </div>
                        <p class="text-gray-700 mb-5">${message}</p>
                        <div class="flex justify-end">
                            <button onclick="window.customAlertConfirm()" 
                                    class="bg-vieshow-red hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-vieshow-red focus:ring-offset-2">
                                確認
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        // 覆寫瀏覽器內建的 alert，統一使用 customAlert
        window.alert = customAlert;

        // 初始渲染 UI 狀態
        // ----------------------------------------------------

        document.addEventListener('DOMContentLoaded', () => {
            // 渲染導覽列 UI
            renderUI();

            // 初始化事件監聽器 (必須在渲染訂單前執行，以確保 setFilter 函數已定義)
            initEventListeners();

            // **修正點：在 DOM 載入完成後，立即載入訂單 (預設 currentFilter 為 'all')**
            renderOrders();
        });

        // 模擬歷史訂單資料 - 更真實的資料結構
        const mockHistoryData = [
            {
                id: 'VS20251101A01',
                movie: {
                    title: '阿凡達 3: 最終戰役',
                    poster: 'https://via.placeholder.com/100x150/4A5568/FFFFFF?text=Avatar+3',

                },

                    { type: '兒童票', quantity: 2, price: 240 }
                ],
                combos: [],
                total: 480,
                status: 'upcoming',
                statusText: '即將上映',
                payment_method: 'line_pay',
                created_at: '2025/11/20 09:15'
            },
            {

                movie: {

                },

                    { type: '全票', quantity: 1, price: 320 }
                ],

                    { name: '單人飲品加購', quantity: 1, price: 80 }
                ],
                total: 400,
                status: 'completed',
                statusText: '已完成',
                payment_method: 'jkopay',
                created_at: '2025/10/10 16:45'
            },
            {
                id: 'VS20251210D04',
                movie: {
                    title: '星際大戰：新希望',
                    poster: 'https://via.placeholder.com/100x150/7C2D12/FFFFFF?text=Star+Wars',
                    duration: '135分鐘',
                    rating: '保護級'
                },
                cinema: '高雄苓雅影城',
                showtime: '2025/12/10 22:00',
                theater: '4廳',
                seats: ['D2', 'D3'],
                tickets: [
                    { type: '全票', quantity: 2, price: 320 }
                ],
                combos: [],
                total: 640,
                status: 'cancelled',
                statusText: '已取消',
                payment_method: 'credit_card',
                created_at: '2025/11/25 20:20',
                cancelled_at: '2025/11/26 10:30'
            }
        ];

        // 合併或讀取本地儲存的訂單歷史（允許編輯後持久化）
        function getStoredHistory() {
            try {
                const raw = localStorage.getItem('bookingHistory');
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.error('解析本地 bookingHistory 失敗', e);
                return [];
            }
        }

        function getHistoryData() {
            const stored = getStoredHistory();
            // clone mock data
            const base = JSON.parse(JSON.stringify(mockHistoryData));
            // merge stored entries by id (replace or add)
            stored.forEach(s => {
                const idx = base.findIndex(b => b.id === s.id);
                if (idx >= 0) base[idx] = s;
                else base.push(s);
            });
            return base;
        }

        // 狀態管理
        let currentFilter = 'all';
        let currentSearch = '';
        let currentPage = 1;
        const itemsPerPage = 5;
        // track last focused element when opening modal for focus restore
        let modalLastFocusedElement = null;

        /**
         * 根據狀態獲取樣式類別
         */
        function getStatusClass(status) {
            switch(status) {
                case 'completed':
                    return 'bg-green-100 text-green-800 border-green-200';
                case 'upcoming':
                    return 'bg-blue-100 text-blue-800 border-blue-200';
                case 'cancelled':
                    return 'bg-gray-100 text-gray-600 border-gray-200';
                default:
                    return 'bg-gray-100 text-gray-600 border-gray-200';
            }
        }

        /**
         * 獲取付款方式圖示
         */
        function getPaymentIcon(method) {
            switch(method) {
                case 'credit_card':
                    return '💳';
                case 'line_pay':
                    return '💚';
                case 'jkopay':
                    return '🟣';
                case 'cash':
                    return '💵';
                default:
                    return '💳';
            }
        }

        /**
         * 篩選和搜尋訂單
         */
        function getFilteredOrders() {
            const data = getHistoryData();

            return data.filter(order => {
                // 狀態篩選
                if (currentFilter !== 'all' && order.status !== currentFilter) {
                    return false;
                }
                
                // 搜尋篩選
                if (currentSearch) {
                    const searchTerm = currentSearch.toLowerCase();
                    const matchesMovie = order.movie.title.toLowerCase().includes(searchTerm);
                    const matchesOrderId = order.id.toLowerCase().includes(searchTerm);
                    return matchesMovie || matchesOrderId;
                }
                
                return true;
            });
        }

        /**
         * 渲染分頁控制
         */
        function renderPagination(totalPages) {
            const container = document.getElementById('paginationContainer');
            
            if (totalPages <= 1) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            
            let html = '';
            
            // 上一頁按鈕
            html += `
                <button onclick="changePage(${currentPage - 1})" 
                        ${currentPage === 1 ? 'disabled' : ''}
                        class="px-3 py-2 rounded-lg border border-gray-300 ${currentPage === 1 ? 'bg-gray-100 text-gray-400' : 'bg-white text-gray-700 hover:bg-gray-50'}">
                    ← 上一頁
                </button>
            `;
            
            // 頁碼按鈕
            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button onclick="changePage(${i})" 
                            class="px-3 py-2 rounded-lg border ${currentPage === i ? 'bg-vieshow-red text-white border-vieshow-red' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}">
                        ${i}
                    </button>
                `;
            }
            
            // 下一頁按鈕
            html += `
                <button onclick="changePage(${currentPage + 1})" 
                        ${currentPage === totalPages ? 'disabled' : ''}
                        class="px-3 py-2 rounded-lg border border-gray-300 ${currentPage === totalPages ? 'bg-gray-100 text-gray-400' : 'bg-white text-gray-700 hover:bg-gray-50'}">
                    下一頁 →
                </button>
            `;
            
            container.innerHTML = html;
        }

        /**
         * 渲染訂單卡片
         */
        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const pagination = document.getElementById('paginationContainer');
            
            // 顯示載入狀態
            loadingState.classList.remove('hidden');
            container.classList.add('hidden');
            emptyState.classList.add('hidden');
            pagination.classList.add('hidden');
            
            // 模擬載入延遲
            setTimeout(() => {
                try {
                    const filteredOrders = getFilteredOrders();
                    const totalPages = Math.ceil(filteredOrders.length / itemsPerPage);
                    const startIndex = (currentPage - 1) * itemsPerPage;
                    const paginatedOrders = filteredOrders.slice(startIndex, startIndex + itemsPerPage);
                    
                    if (paginatedOrders.length === 0) {
                        loadingState.classList.add('hidden');
                        emptyState.classList.remove('hidden');
                        return;
                    }
                    
                    let html = '';
                    
                    paginatedOrders.forEach(order => {
                        const statusClass = getStatusClass(order.status);
                        const paymentIcon = getPaymentIcon(order.payment_method);
                        
                        html += `
                            <div class="order-card bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
                                <div class="p-6">
                                    <div class="flex flex-col lg:flex-row gap-6">
                                        <!-- 電影海報 -->
                                        <div class="flex-shrink-0">
                                            <img src="${order.movie.poster}" alt="${order.movie.title}" 
                                                class="w-20 h-28 object-cover rounded-lg shadow-sm">
                                        </div>
                                        
                                        <!-- 訂單資訊 -->
                                        <div class="flex-1">
                                            <div class="flex flex-col md:flex-row md:items-start md:justify-between mb-4">
                                                <div>
                                                    <h3 class="text-xl font-bold text-gray-900 mb-1">${order.movie.title}</h3>
                                                    <div class="flex items-center space-x-4 text-sm text-gray-600 mb-2">
                                                        <span>${order.cinema}</span>
                                                        <span>•</span>
                                                        <span>${order.theater}</span>
                                                        <span>•</span>
                                                        <span>${order.movie.duration}</span>
                                                    </div>
                                                </div>
                                                <div class="flex items-center space-x-2">
                                                    <span class="px-3 py-1 rounded-full text-sm font-medium border ${statusClass}">
                                                        ${order.statusText}
                                                    </span>
                                                </div>
                                            </div>
                                            
                                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 text-sm">
                                                <div>
                                                    <span class="text-gray-500">場次時間</span>
                                                    <p class="font-semibold">${order.showtime}</p>

                                                        class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg text-sm font-medium transition duration-300">

                                                </button>

                                                            class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium transition duration-300">

                                                    <button onclick="shareOrder('${order.id}')"

                                                            class="px-4 py-2 bg-vieshow-gold hover:bg-yellow-600 text-white rounded-lg text-sm font-medium transition duration-300">

                    });
                
                    container.innerHTML = html;
                    loadingState.classList.add('hidden');

                } catch (error) {

                        // 確保載入畫面被隱藏
                        loadingState.classList.add('hidden');
                        container.classList.remove('hidden'); // 確保容器在完成後顯示
                }
            }, 800);
        }

        /**

        /**
         * 顯示通知
         */
        function showNotification(message, isError = false) {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-xl z-50 transition duration-300 ${
                isError ? 'bg-red-100 text-red-800 border border-red-200' : 'bg-green-100 text-green-800 border border-green-200'
            } animate-fade-in-down`;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.replace('animate-fade-in-down', 'animate-fade-out-up');
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        // Inline modal-based edit flow removed: editing is now performed on a dedicated page
        // Use `booking_edit_order.html?orderId=...` for full edit workflow. The previous
        // openEditForm / saveEdit functions were removed to avoid duplicate editing UIs.

        // send modification notification -- uses mailto fallback; can be replaced with EmailJS or server API
        function sendModificationEmail(order) {
            // Attempt to get user's email from localStorage user object
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            let recipient = user.email || '';
            if (!recipient) {
                // prompt for recipient if not available
                recipient = prompt('請輸入收信者電子郵件（用於寄送修改通知）', '');
                if (!recipient) {
                    showNotification('未提供電子郵件，未寄送通知', true);
                    return;
                }
            }

            const subject = encodeURIComponent(`[Vieshow] 訂單 ${order.id} 已更新`);
            const bodyLines = [];
            bodyLines.push(`訂單編號：${order.id}`);
            bodyLines.push(`電影：${order.movie?.title || order.movieTitle || ''}`);
            bodyLines.push(`場次：${order.showtime?.date || order.showtime || ''} ${order.showtime?.time || ''}`);
            bodyLines.push(`聯絡人：${order.groupInfo?.contactName || ''}`);
            bodyLines.push(`聯絡電話：${order.groupInfo?.contactPhone || ''}`);
            bodyLines.push(`票數：${order.totalTicketQty || ''}`);
            bodyLines.push(`備註：${order.groupInfo?.note || ''}`);
            bodyLines.push('\n若需協助請聯絡客服。');

            const body = encodeURIComponent(bodyLines.join('\n'));

            // Open user's mail client with prefilled message
            const mailto = `mailto:${recipient}?subject=${subject}&body=${body}`;
            window.location.href = mailto;

            // NOTE: For automatic sending without opening mail client, integrate EmailJS or a backend API.
            // Example (requires EmailJS account/config):
            // emailjs.send('service_id','template_id',{to_email: recipient, order_id: order.id, ...}, 'user_xxx')
            //   .then(() => showNotification('已寄出修改通知'), err => showNotification('寄送失敗', true));
        }

        // wrapper to find order by id and call sendModificationEmail
        window.sendModificationEmailById = function(orderId) {
            const order = getHistoryData().find(o => o.id === orderId);
            if (!order) { showNotification('找不到訂單，無法寄信', true); return; }
            sendModificationEmail(order);
        }

        // Start editing an existing order: populate currentBooking and set editing flag then navigate to Step 2
        window.startEdit = function(orderId) {
            const order = getHistoryData().find(o => o.id === orderId);
            if (!order) { showNotification('找不到訂單，無法編輯', true); return; }

            // Map human-readable ticket type names to Step2 ticket ids
            const ticketNameToId = (name) => {
                if (!name) return null;
                name = name.trim();
                if (name.includes('全票') || name === '全票') return 'full';
                if (name.includes('學生') || name === '學生票') return 'student';
                if (name.includes('長者') || name.includes('敬老') || name.includes('愛心')) return 'elder';
                if (name.includes('兒童') || name.includes('兒童票')) return 'child';
                // fallback: attempt lowercase match
                const low = name.toLowerCase();
                if (low.includes('adult') || low.includes('full')) return 'full';
                return null;
            };

            // Build a currentBooking object compatible with booking_flow_2.html
            const step2 = {
                id: order.id,
                movie: order.movie,
                cinema: { name: order.cinema },
                showtime: { // try to parse naive
                    date: order.showtime || '',
                    time: '',
                    theater: order.theater || ''
                },
                seats: order.seats || [],
                // tickets: will be an object keyed by ticket id (full, student, elder, child)
                tickets: {},
                combos: {},
                totalPrice: order.total || 0,
                total: order.total || 0
            };

            if (Array.isArray(order.tickets)) {
                order.tickets.forEach(t => {
                    const id = ticketNameToId(t.type) || t.type;
                    step2.tickets[id] = {
                        name: t.type,
                        price: t.price,
                        qty: t.quantity,
                        subtotal: (t.price || 0) * (t.quantity || 0)
                    };
                });
            }

            if (Array.isArray(order.combos)) {
                // combos are matched by name; booking_flow_2's MOCK_COMBOS uses ids like combo_a
                // Here we store combos keyed by name (booking_flow_2 will try to match by name)
                order.combos.forEach(c => {
                    step2.combos[c.name] = {
                        name: c.name,
                        price: c.price,
                        qty: c.quantity,
                        subtotal: (c.price || 0) * (c.quantity || 0)
                    };
                });
            }

            // Persist editing context
            try {
                // compute original ticket qty
                let originalTicketQty = 0;
                if (Array.isArray(order.tickets)) {
                    originalTicketQty = order.tickets.reduce((s,t) => s + (t.quantity || 0), 0);
                } else if (typeof order.tickets === 'object') {
                    originalTicketQty = Object.values(order.tickets).reduce((s,t) => s + (t.quantity || t.qty || 0), 0);
                }

                localStorage.setItem('currentBooking', JSON.stringify(step2));
                localStorage.setItem('editingOrder', JSON.stringify({ orderId: order.id, originalTotal: order.total || 0, originalTicketQty }));
            } catch (e) {
                console.error('localStorage 寫入失敗', e);
            }

            // Navigate to booking step 2
            window.location.href = 'booking_flow_2.html';
        }

        /**
         * 初始化事件監聽器
         */
        function initEventListeners() {
            // 搜尋輸入
            const searchInput = document.getElementById('searchInput');

            // 檢查 searchInput 元素是否存在
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    currentSearch = this.value;
                    currentPage = 1;
                    renderOrders();
                });
            }
            // 篩選按鈕
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'bg-vieshow-red', 'text-white'));
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.add('bg-gray-200', 'text-gray-700'));
                    
                    this.classList.remove('bg-gray-200', 'text-gray-700');
                    this.classList.add('active', 'bg-vieshow-red', 'text-white');
                    
                    currentFilter = this.dataset.status;
                    currentPage = 1;
                    renderOrders();
                });
            });
            
            // 搜尋輸入
            document.getElementById('searchInput').addEventListener('input', function() {
                currentSearch = this.value;
                currentPage = 1;
                renderOrders();
            });
            
            // 關閉 Modal
                const modal = document.getElementById('orderDetailModal');
                const closeModalBtn = document.getElementById('closeModal');

                closeModalBtn.addEventListener('click', function() {
                    modal.classList.add('hidden');
                    modal.setAttribute('aria-hidden', 'true');
                    if (modalLastFocusedElement) { modalLastFocusedElement.focus(); }
                });

                // 點擊 Modal 背景關閉
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.add('hidden');
                        this.setAttribute('aria-hidden', 'true');
                        if (modalLastFocusedElement) { modalLastFocusedElement.focus(); }
                    }
                });

                // ESC 鍵關閉 Modal 並管理焦點
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' || e.key === 'Esc') {
                        if (!modal.classList.contains('hidden')) {
                            modal.classList.add('hidden');
                            modal.setAttribute('aria-hidden', 'true');
                            if (modalLastFocusedElement) { modalLastFocusedElement.focus(); }
                        }
                    }
                });
            
            // // 登出按鈕
            // document.getElementById('signOutButton').addEventListener('click', function() {
            //     if (confirm('確定要登出嗎？')) {
            //         showNotification('已成功登出，正在導向首頁...');
            //         setTimeout(() => {
            //             window.location.href = '../../index.html';
            //         }, 1500);
            //     }
            // });
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 1. 初始化事件監聽器
            initEventListeners();
            
            // 2. 設定初始篩選狀態為「全部訂單」
            // 假設您的 HTML 中，「全部訂單」按鈕的 data-status 設為 'all'
            const allOrdersBtn = document.querySelector('.filter-btn[data-status="all"]');
            
            if (allOrdersBtn) {
                // 確保視覺效果是選中的
                allOrdersBtn.classList.remove('bg-gray-200', 'text-gray-700');
                allOrdersBtn.classList.add('active', 'bg-vieshow-red', 'text-white');
                
                // 確保邏輯狀態正確
                currentFilter = 'all'; 
                currentPage = 1;
            }
            
            // 3. 啟動第一次渲染
            renderOrders(); 
        });
    </script>
