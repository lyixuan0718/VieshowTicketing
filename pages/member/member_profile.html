<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改會員資料 - Vieshow Ticketing</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vieshow-red': '#e50914',
                        'vieshow-gold': '#f7a83d',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">
    
    <header class="bg-gray-800 text-white shadow-md">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../../index.html" class="text-xl font-bold hover:text-vieshow-red transition duration-300">Vieshow 影城</a>
            <div id="headerNavRight" class="space-x-4 flex items-center">
                </div>
        </nav>
    </header>

    <div class="container mx-auto px-4 py-10 flex-grow max-w-lg">
        
        <div class="bg-white p-6 sm:p-8 rounded-xl shadow-xl border-t-4 border-vieshow-red">
            <h2 class="text-3xl font-extrabold text-gray-800 mb-2 flex items-center justify-center">
                👤 修改會員資料
            </h2>
            <p class="text-center text-gray-500 mb-8">在此更新您的個人資訊。</p>

            <div id="messageContainer" class="hidden p-3 mb-4 rounded-lg font-medium" role="alert"></div>

            <form id="profileForm" action="#" method="POST" class="space-y-6">
                
                <div>
                    <label for="memberName" class="block text-sm font-medium text-gray-700 mb-1">姓名:</label>
                    <input type="text" id="memberName" name="memberName" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-vieshow-red focus:border-vieshow-red transition duration-150"
                            value="李怡萱">
                </div>
                
                <div>
                    <label for="memberEmail" class="block text-sm font-medium text-gray-700 mb-1">電子郵件 (Email):</label>
                    <input type="email" id="memberEmail" name="memberEmail" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-vieshow-red focus:border-vieshow-red transition duration-150"
                            value="yihsuan@vieshow.com">
                </div>
                
                <div>
                    <label for="memberPhone" class="block text-sm font-medium text-gray-700 mb-1">行動電話:</label>
                    <input type="tel" id="memberPhone" name="memberPhone" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-vieshow-red focus:border-vieshow-red transition duration-150"
                            value="0912345678">
                </div>
                
                <div>
                    <label for="memberBirth" class="block text-sm font-medium text-gray-700 mb-1">生日:</label>
                    <input type="date" id="memberBirth" name="memberBirth" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-vieshow-red focus:border-vieshow-red transition duration-150"
                            value="1995-10-22">
                </div>
                
                <p class="pt-2 text-lg">
                    <a href="../auth/forget_password.html" class="text-blue-600 hover:text-blue-800 hover:underline font-medium transition duration-200">
                        [修改密碼]
                    </a>
                </p>

                <button type="submit" class="update-button w-full bg-vieshow-red text-white py-3 rounded-lg font-bold text-lg hover:bg-red-700 transition duration-200 shadow-md">
                    儲存變更
                </button>
            </form>
            <p class="mt-4 text-xs text-gray-500 text-center">
                提交後，系統將更新您的會員資料。
            </p>
        </div>
    </div>

    <footer class="bg-gray-800 text-white text-center py-4 mt-8 shadow-inner">
        <p>&copy; 2025 Vieshow Ticketing System</p>
    </footer>

    <script>
        // ----------------------------------------------------
        // 1. 頁面路徑常數定義
        // ----------------------------------------------------
        const LOGIN_PAGE_URL = '../auth/login.html';
        const MEMBER_HOME_URL = 'member_home.html';
        const INDEX_PAGE_URL = '../../index.html';

        // ----------------------------------------------------
        // 2. 核心函數：登入/登出狀態渲染
        // ----------------------------------------------------

        function renderLoggedOutState() {
            const headerNavRight = document.getElementById('headerNavRight');
            if (!headerNavRight) return;
            headerNavRight.innerHTML = `
                <a href="${LOGIN_PAGE_URL}" class="hover:text-vieshow-gold transition duration-300">登入</a>
                <a href="${MEMBER_HOME_URL}" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            `;
        }

        function renderLoggedInState() {
            const headerNavRight = document.getElementById('headerNavRight');
            if (!headerNavRight) return;

            headerNavRight.innerHTML = `
                <a href="#" id="signOutLink" class="hover:text-vieshow-gold transition duration-300">登出</a>
                <a href="${MEMBER_HOME_URL}" class="hover:text-vieshow-gold transition duration-300">會員中心</a>
            `;
            
            document.getElementById('signOutLink')?.addEventListener('click', handleSignOut);
        }

        /**
         * 【***修正區塊 1/2***】處理登出邏輯，將動作延遲到 customAlert 的 callback 中。
         */
        function handleSignOut(e) {
            e.preventDefault();
            
            // 由於清除 token 和跳轉必須在用戶按「確認」後才執行
            const signOutCallback = () => {
                // 1. 清除登入狀態
                localStorage.removeItem('auth_token');

                // 2. 延遲導向首頁
                setTimeout(() => {
                    window.location.href = INDEX_PAGE_URL;
                }, 2000);

                // 立即更新 UI 狀態
                renderUI(); 
            };

            // 顯示登出訊息，並將包含清除 token 和跳轉的函數作為 callback 傳入
            customAlert('您已成功登出。即將導向首頁...', signOutCallback); 
        }

        function renderUI() {
            const token = localStorage.getItem('auth_token');

            if (token) {
                renderLoggedInState(); 
            } else {
                renderLoggedOutState(); 
            }
        }


        // ----------------------------------------------------
        // 3. 【***修正區塊 2/2***】統一的自定義 Alert 函數 (新增 callback 支援)
        // ----------------------------------------------------

        /**
         * 自定義 Modal 警告框，並接受一個點擊確認後執行的 callback 函數。
         * @param {string} message - 顯示的訊息。
         * @param {function} [callback] - 用戶點擊「確認」後要執行的函數 (可選)。
         */
        function customAlert(message, callback) { 
            const existingModal = document.getElementById('custom-alert-modal');
            if (existingModal) existingModal.remove();

            // 處理點擊「確認」的邏輯
            const handleConfirm = () => {
                document.getElementById('custom-alert-modal').remove();
                // 只有在用戶點擊確認後，才執行傳入的 callback 函數
                if (callback && typeof callback === 'function') {
                    callback(); 
                }
            };

            // 將 handleConfirm 函數註冊到全域，確保 HTML onclick 可以找到它
            window.customAlertConfirm = handleConfirm;


            const modalHtml = `
                <div id="custom-alert-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm transform scale-100 transition-all duration-300">
                        <div class="text-xl font-bold text-gray-900 mb-3 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-vieshow-red mr-2" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                            系統提示
                        </div>
                        <p class="text-gray-700 mb-5">${message}</p>
                        <div class="flex justify-end">
                            <button onclick="window.customAlertConfirm()" 
                                    class="bg-vieshow-red hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-vieshow-red focus:ring-offset-2">
                                確認
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        // 覆寫瀏覽器內建的 alert，統一使用 customAlert
        window.alert = customAlert;

        // ----------------------------------------------------
        // 4. 表單處理邏輯 (未變動)
        // ----------------------------------------------------

        /**
         * 顯示一個自定義的頂部通知
         */
        function showFormMessage(text, type) {
            const container = document.getElementById('messageContainer');
            container.textContent = text;
            container.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (type === 'success') {
                container.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'error') {
                container.classList.add('bg-red-100', 'text-red-800');
            }

            // 3秒後隱藏
            setTimeout(() => {
                container.classList.add('hidden');
            }, 3000);
        }

        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            // 模擬 AJAX 提交或後端更新操作
            const name = document.getElementById('memberName').value;
            const phone = document.getElementById('memberPhone').value;
            const birth = document.getElementById('memberBirth').value;

            console.log("模擬提交的會員資料:", { name, phone, birth });

            // 模擬成功回覆
            showFormMessage('🎉 資料更新成功！', 'success');
        });

        // ----------------------------------------------------
        // 5. 初始化 (未變動)
        // ----------------------------------------------------

        document.addEventListener('DOMContentLoaded', () => {
            // 渲染導覽列 UI
            renderUI();
        });
    </script>
    
</body>
</html>
