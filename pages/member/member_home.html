<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員中心 - Vieshow 影城</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 自定義樣式 */
        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            /* 讓按鈕更大 */
            padding: 1rem 1rem; 
            border-radius: 0.25rem; /* 較銳利的邊角 */
            font-weight: 700;
            transition: background-color 0.2s;
            text-align: center;
            box-shadow: none; /* 移除陰影 */
            border: 1px solid #e5e7eb; /* 淺灰色邊框，用於白色按鈕 */
        }
        .btn-action.red-btn {
            border-color: #e50914; /* 紅色按鈕有紅色邊框 */
        }
        /* 模擬圖片中功能區標題的紅色分隔線 */
        .functional-title-line {
            height: 100%;
            width: 4px; /* 紅線寬度 */
            background-color: #e50914; /* Vieshow 紅色 */
            margin-right: 1rem;
        }

        /* 模擬手繪邊框的樣式 (使用 Tailwind 實作，但這裡定義一個類名方便使用) */
        .hand-drawn-border {
            border: 2px solid #ffcc00; /* 黃色邊框 */
            box-shadow: 0 0 0 4px rgba(255, 204, 0, 0.3); /* 模擬邊緣模糊/描邊 */
        }

        /* 新增通知動畫 (沿用原來的) */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes fadeOutUp {
            from { opacity: 1; transform: translate(-50%, 0); }
            to { opacity: 0; transform: translate(-50%, -20px); }
        }
        .animate-fade-in-down { animation: fadeInDown 0.5s ease-out forwards; }
        .animate-fade-out-up { animation: fadeOutUp 0.5s ease-in forwards; }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vieshow-red': '#e50914',
                        'vieshow-gold': '#ffcc00', /* 接近圖片中手繪的黃色 */
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-white font-sans min-h-screen">
    
    <header class="bg-white border-b border-gray-200">
        <nav class="container mx-auto px-4 py-3 flex justify-between items-center max-w-4xl">
            <a href="../../index.html" class="text-xl font-bold text-gray-800 hover:text-vieshow-red transition duration-300">Vieshow 影城</a>
            <div id="headerNavRight" class="text-sm">
                </div>
        </nav>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        
        <div class="flex flex-col lg:flex-row gap-8">
            
            <div class="lg:w-1/2 p-6 bg-white border-4 border-vieshow-gold hand-drawn-border">
                <h1 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                    <span class="mr-2">👤</span> 會員中心首頁 
                    <span id="memberGreeting" class="text-sm font-medium ml-3 text-gray-500"></span>
                </h1>
                
                <h2 class="text-2xl font-extrabold text-gray-800 mb-4 border-b pb-2 border-gray-200">會員資料:</h2>
                
                <div id="memberInfoDisplay" class="space-y-4 text-gray-700">
                    <p class="text-lg font-medium">姓名: <span id="memberName" class="font-bold text-xl ml-2">...</span></p>
                    <p class="text-lg font-medium">gmail: <span id="memberEmail" class="font-normal ml-2">...</span></p>
                    <p class="text-lg font-medium">電話: <span id="memberPhone" class="font-normal ml-2">...</span></p>
                    <p class="text-lg font-medium">生日: <span id="memberBirthday" class="font-normal ml-2">...</span></p>
                    <p class="text-lg font-medium">回饋點數: <span id="memberPoints" class="font-bold text-vieshow-red text-2xl ml-2">...</span></p>
                    <p class="text-lg font-medium">會員編號: <span id="memberID" class="font-normal ml-2">...</span></p>

                    <div class="pt-4">
                        <p class="text-sm text-gray-500 mb-1">編碼</p>
                        <div class="h-10 bg-gray-900 flex justify-between items-end px-1" style="border: 1px solid #000; font-size: 0;">
                            <span class="inline-block h-full w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-4/5 w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-full w-1 bg-gray-900"></span>
                            <span class="inline-block h-2/3 w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-full w-1.5 bg-gray-900"></span>
                            <span class="inline-block h-4/5 w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-full w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-2/3 w-1 bg-gray-900"></span>
                            <span class="inline-block h-full w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-4/5 w-1.5 bg-gray-900"></span>
                            <span class="inline-block h-full w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-2/3 w-1 bg-gray-900"></span>
                            <span class="inline-block h-full w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-4/5 w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-full w-1 bg-gray-900"></span>
                            <span class="inline-block h-2/3 w-0.5 bg-gray-900"></span>
                            <span class="inline-block h-full w-1.5 bg-gray-900"></span>
                            </div>
                    </div>
                </div>
            </div>
            
            <div class="lg:w-1/2 flex flex-col">
                <div class="flex items-center mb-6">
                    <div class="functional-title-line"></div>
                    <h2 class="text-xl font-bold text-gray-800">快速功能導覽</h2>
                </div>
                
                <div class="member-actions grid grid-cols-2 gap-4 flex-grow">
                    
                    <a href="../../index.html" class="btn-action bg-white text-gray-700 hover:bg-gray-100">
                        <span class="mr-2">🏠</span> 首頁
                    </a>
                    
                    <a href="../booking/booking_flow_1.html" class="btn-action red-btn bg-vieshow-red text-white hover:bg-red-700">
                        <span class="mr-2">🎫</span> 立即訂票
                    </a>
                    
                    <a href="../booking/booking_history.html" class="btn-action bg-white text-gray-700 hover:bg-gray-100">
                        <span class="mr-2">🧾</span> 訂票紀錄
                    </a>
                    
                    <a href="../points/point_exchange.html" class="btn-action bg-white text-gray-700 hover:bg-gray-100">

                    </a>
                    
                    <a href="./topup.html" class="btn-action bg-white text-gray-700 hover:bg-gray-100">

                    <a href="./member_profile.html" class="btn-action bg-white text-gray-700 hover:bg-gray-100">

                    </a>
                    
                    <button id="signOutButton" class="btn-action red-btn bg-vieshow-red text-white hover:bg-red-700 col-span-2 mt-4 self-end">

                </div>
            </div>
            
        </div>

    <footer class="bg-white text-gray-500 text-center py-4 mt-8 border-t border-gray-200">
        <p>&copy; 2025 Vieshow Ticketing System</p>
    </footer>

    <script>
        const LOGIN_PAGE_URL = '../auth/login.html';
        const INDEX_PAGE_URL = '../../index.html';

        // --- 模擬資料庫 ---
        const MEMBER_DB = {
            'valid_token_12345': {
                id: 'XXXXXXX',
                name: '王大明',
                email: 'xxx@gmail.com',
                phone: '0912345678',
                birthday: '2000/01/01',
                points: 20000 
            }
            // 可以在這裡添加更多模擬會員
        };

        /**
         * 統一的通知顯示函數
         */
        function showNotification(message, isError = false) {
            const notification = document.createElement('div');
            notification.innerHTML = message;
            const bgColor = isError ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800';
            
            notification.className = `fixed top-0 left-1/2 -translate-x-1/2 mt-4 px-6 py-3 rounded-lg shadow-xl z-50 transition duration-300 transform ${bgColor} animate-fade-in-down`;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.replace('animate-fade-in-down', 'animate-fade-out-up');
                setTimeout(() => notification.remove(), 500); 
            }, 3000); 
        }

        /**
         * 檢查登入狀態：如果沒有 Token 或 Token 無效則跳轉到登入頁。
         */
        function checkLoginStatus() {
            const token = localStorage.getItem('auth_token');
            if (!token || !MEMBER_DB[token]) {
                // 如果沒有 Token 或 Token 在模擬 DB 中找不到
                window.location.href = LOGIN_PAGE_URL;
                document.body.innerHTML = '<p class="text-center text-xl p-10">您尚未登入或登入狀態失效，正在導向登入頁面...</p>';
                return null;
            }
            return MEMBER_DB[token]; // 返回有效的會員資料
        }

        /**
         * 填充頁面上的會員資料。
         * @param {object} memberData - 會員資料物件。
         */
        function populateMemberData(memberData) {
            document.getElementById('memberGreeting').textContent = `(Hi, ${memberData.name})`;
            document.getElementById('memberName').textContent = memberData.name;
            document.getElementById('memberEmail').textContent = memberData.email;
            document.getElementById('memberPhone').textContent = memberData.phone;
            document.getElementById('memberBirthday').textContent = memberData.birthday;
            // 點數格式化，使用千分位逗號
            document.getElementById('memberPoints').textContent = memberData.points.toLocaleString('en-US'); 
            document.getElementById('memberID').textContent = memberData.id;
        }

        // --- 登出處理 ---
        document.getElementById('signOutButton').addEventListener('click', function(e) {
            e.preventDefault(); 

            this.disabled = true; 
            this.textContent = '登出中...';

            // 1. 清除登入狀態
            localStorage.removeItem('auth_token'); 
            
            // 2. 顯示登出訊息
            showNotification('✅ 登出成功！即將導向首頁...', false);

            // 3. 延遲 2 秒後導向首頁
            setTimeout(() => {
                window.location.href = INDEX_PAGE_URL; 
            }, 2000);
        });

        // 頁面載入時執行檢查和資料填充
        window.onload = function() {
            // 模擬登入成功後儲存一個有效的 Token
            // 實際測試時請確保 localStorage.getItem('auth_token') 有 'valid_token_12345'
            if (!localStorage.getItem('auth_token')) {
                localStorage.setItem('auth_token', 'valid_token_12345');
            }


            const memberData = checkLoginStatus();
            if (memberData) {
                populateMemberData(memberData);
                console.log("會員中心頁面初始化完成，資料已載入。");
            }
        };
    </script>
    
</body>
</html>
