<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員中心 - Vieshow Ticketing</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 自定義樣式 */
        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem; /* rounded-lg */
            font-weight: 700; /* font-bold */
            transition: all 0.2s ease-in-out;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            border: 1px solid transparent;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* 新增通知動畫 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes fadeOutUp {
            from { opacity: 1; transform: translate(-50%, 0); }
            to { opacity: 0; transform: translate(-50%, -20px); }
        }
        .animate-fade-in-down { animation: fadeInDown 0.5s ease-out forwards; }
        .animate-fade-out-up { animation: fadeOutUp 0.5s ease-in forwards; }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vieshow-red': '#e50914',
                        'vieshow-gold': '#f7a83d',
                        'btn-primary': '#4f46e5', /* Indigo for primary actions */
                        'btn-hover': '#4338ca',
                        'btn-danger': '#ef4444', /* Red for danger/logout */
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">
    
    <header class="bg-gray-800 text-white shadow-md">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../../index.html" class="text-xl font-bold hover:text-vieshow-red transition duration-300">Vieshow 影城</a>
            <div id="headerNavRight" class="space-x-4 flex items-center">
            </div>
        </nav>
    </header>

    <div class="container mx-auto px-4 py-10 flex-grow max-w-lg">
        
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-t-4 border-vieshow-gold">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-4 flex items-center">
                <span class="mr-2">👤</span> 會員中心首頁 
                <span class="text-base font-normal ml-3 text-gray-500">(Hi, 王小明)</span>
            </h1>
            
            <p class="text-lg font-medium text-gray-700 mt-2">
                您目前的點數：<span id="memberPoints" class="text-vieshow-gold font-bold text-2xl">850 點</span>
            </p>
        </div>

        <h2 class="text-2xl font-bold text-gray-700 mb-4 border-l-4 border-vieshow-red pl-3">快速功能導覽</h2>
        
        <div class="member-actions grid grid-cols-2 gap-4">
            
            <a href="../../index.html" class="btn-action bg-white text-gray-700 border-gray-300 hover:bg-gray-100">
                <span class="mr-2">🏠</span> 首頁
            </a>
            
            <a href="../booking/booking_flow_1.html" class="btn-action bg-vieshow-red text-white hover:bg-red-700">
                <span class="mr-2">🎫</span> 立即訂票
            </a>
            
            <a href="../booking/booking_history.html" class="btn-action bg-white text-gray-700 border-gray-300 hover:bg-gray-100">
                <span class="mr-2">🧾</span> 歷史訂票紀錄
            </a>
            
            <a href="../points/point_exchange.html" class="btn-action bg-white text-gray-700 border-gray-300 hover:bg-gray-100">
                <span class="mr-2">🪙</span> 點數兌換
            </a>
            
            <a href="./topup.html" class="btn-action bg-white text-gray-700 border-gray-300 hover:bg-gray-100">
                <span class="mr-2">💳</span> 點數儲值
            </a>
            
            <a href="./member_profile.html" class="btn-action bg-white text-gray-700 border-gray-300 hover:bg-gray-100">
                <span class="mr-2">⚙️</span> 會員資料修改
            </a>
            
            <button id="signOutButton" class="btn-action bg-btn-danger text-white hover:bg-red-600 col-span-2 mt-4">
                <span class="mr-2">➡️</span> 登出
            </button>
            
        </div>
        
    </div>

    <footer class="bg-gray-800 text-white text-center py-4 mt-8 shadow-inner">
        <p>&copy; 2025 Vieshow Ticketing System</p>
    </footer>

    <script>
        const LOGIN_PAGE_URL = '../auth/login.html';
        const INDEX_PAGE_URL = '../../index.html';

        /**
         * 統一的通知顯示函數 (從登入頁複製)
         * @param {string} message - 顯示的訊息 (允許簡單 HTML 如 <b>)。
         * @param {boolean} isError - 是否為錯誤/失敗訊息 (影響顏色)。
         */
        function showNotification(message, isError = false) {
            const notification = document.createElement('div');
            notification.innerHTML = message;
            // 成功用 Green (登出成功)，失敗/警告用 Red
            const bgColor = isError ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800';
            
            // 使用 fixed 定位和動畫 class
            notification.className = `fixed top-0 left-1/2 -translate-x-1/2 mt-4 px-6 py-3 rounded-lg shadow-xl z-50 transition duration-300 transform ${bgColor} animate-fade-in-down`;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.replace('animate-fade-in-down', 'animate-fade-out-up');
                setTimeout(() => notification.remove(), 500); // 讓淡出動畫完成
            }, 3000); // 顯示 3 秒
        }

        /**
         * 檢查登入狀態：如果沒有 Token 則跳轉到登入頁。
         */
        function checkLoginStatus() {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = LOGIN_PAGE_URL;
                document.body.innerHTML = '<p class="text-center text-xl p-10">您尚未登入，正在導向登入頁面...</p>';
                return false;
            }
            return true;
        }

        // --- 登出處理 (使用 showNotification) ---
        document.getElementById('signOutButton').addEventListener('click', function(e) {
            e.preventDefault(); 

            // 禁用按鈕以防止重複點擊
            this.disabled = true; 
            this.textContent = '登出中...';

            // 1. 清除登入狀態的關鍵步驟
            localStorage.removeItem('auth_token'); 
            
            // 2. 顯示登出訊息 (使用彈跳框)
            showNotification('✅ 登出成功！即將導向首頁...', false);
            
            // 3. 替換 Header 導航為未登入狀態 (視覺更新)
            const headerNavRight = document.getElementById('headerNavRight');
            if (headerNavRight) {
                headerNavRight.innerHTML = `
                    <a href="${LOGIN_PAGE_URL}" class="hover:text-vieshow-gold transition duration-300">登入</a>
                    <a href="../auth/register.html" class="hover:text-vieshow-gold transition duration-300">註冊</a>
                `;
            }

            // 4. 延遲 2 秒後導向首頁
            setTimeout(() => {
                window.location.href = INDEX_PAGE_URL; 
            }, 2000);
        });

        // 頁面載入時執行檢查
        window.onload = function() {
            if (!checkLoginStatus()) {
                return; 
            }
            console.log("會員中心頁面初始化完成。");
        };
    </script>
    
</body>
</html>
