    <style>
        /* 核心樣式 - 按鈕和通知 (保留原有) */
        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem; /* rounded-lg */
            font-weight: 700; /* font-bold */
            transition: all 0.2s ease-in-out;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            border: 1px solid transparent;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* 通知動畫 (保留原有) */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes fadeOutUp {
            from { opacity: 1; transform: translate(-50%, 0); }
            to { opacity: 0; transform: translate(-50%, -20px); }
        }
        .animate-fade-in-down { animation: fadeInDown 0.5s ease-out forwards; }
        .animate-fade-out-up { animation: fadeOutUp 0.5s ease-in forwards; }

        /* 會員資訊面板樣式 */
        .member-info-panel {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            /* 模擬原設計的頂部黃色邊框 */
            border-top: 4px solid #f7a83d; 
        }

        /* 快速功能標題左側紅線 */
        .functional-title-line {
            width: 4px;
            background-color: #e50914; 
            margin-right: 0.75rem; /* 模擬 ml-3 */
            height: 1.5rem; /* 配合文字高度 */
        }
        
        /* --- Code 128 條碼模擬樣式 (依據 JS 邏輯修正) --- */
        /* 條碼容器：使用 flex 佈局來實現佈滿整個寬度 */
        .barcode-container {
            display: flex;
            align-items: stretch; 
            height: 45px; /* 條碼高度 */
            background-color: white;
            border: 1px solid #000;
            padding: 0; 
            overflow: hidden;
            flex-wrap: nowrap;
            width: 100%; 
        }
        /* 條碼線和間隔：使用 flex-grow 屬性分配寬度 */
        .barcode-line, .barcode-space {
            display: inline-block;
            height: 100%; 
            margin: 0;
            padding: 0;
            flex-shrink: 0;
            /* JS 邏輯使用 style.flexGrow = factor 來動態分配寬度 */
        }
        .barcode-line {
            background-color: #000;
        }
        .barcode-space {
            background-color: transparent; /* 白色間隔 */
        }
    </style>

    <script>
        const LOGIN_PAGE_URL = '../auth/login.html';
        const INDEX_PAGE_URL = '../../index.html';

        // --- 模擬資料庫：新增會員資料 (保留原有) ---
        const MEMBER_DB = {
            'valid_token_12345': {
                id: 'VIESHOW12345', // 使用包含字母的 ID 測試 Code 128 B
                name: '王大明',
                email: 'xxx@gmail.com',
                phone: '0123 456 789',
                birthday: '2000/01/01',
                points: 20000 
            },
            'test_token_98765': {
                id: 'MOVIE98765', 
                name: '李小美',
                email: 'test@gmail.com',
                phone: '0987 654 321',
                birthday: '1995/11/20',
                points: 1500 
            }
        };
        
        // Code 128 編碼表 (Code B/C - 僅包含數字和啟動/停止/校驗碼所需的值) (保留原有)
        // 格式: 3條黑線和 3 條白間隔的寬度乘數
        const CODE128_B_ENCODING = [
            '212222', '222122', '222221', '121223', '123221', '131221', '122213', '122312', '123122', '221213', // 0-9
            '221312', '231212', '112232', '122132', '122231', '113222', '123122', '122132', '122231', '211232', // 10-19
            '213212', '212231', '231221', '312122', '321122', '321221', '312212', '322112', '322211', '212123', // 20-29
            '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313', '231113', // 30-39
            '231311', '113123', '133121', '311123', '311321', '313121', '221132', '221231', '213212', '213231', // 40-49
            '231131', '312131', '311321', '321131', '321311', '212213', '213212', '213311', '211331', '213131', // 50-59
            '311213', '312132', '321123', '321213', '323121', '313211', '321113', '311321', '313113', '311312', // 60-69
            '223112', '322111', '112223', '121123', '121321', '112312', '122113', '122311', '113122', '123112', // 70-79
            '121231', '311222', '321221', '322121', '323121', '313211', '321113', '311312', '313112', '311312', // 80-89
            '311132', '123311', '113321', '133112', '133211', '213122', '213212', '213311', '211331', '213131', // 90-99
            '221133', '221331', '233111', '223121', '313131', '1121223' // START B, START C, STOP
        ]; 
        
        const START_CODE_B = 104; // Code 128 Start B 符號值
        const STOP_CODE = 106; // Code 128 Stop 符號值
        
        // 輔助函數：根據 Code 128 的 6 個數字（3條線，3個間隔）繪製條碼 (保留原有)
        function drawPattern(code, container) {
            const widthFactors = code.split('').map(Number);
            let isBar = true; 

            for (const factor of widthFactors) {
                const element = document.createElement('span');
                
                // 關鍵：使用 flexGrow 屬性，根據 Code 128 的單位寬度來分配容器空間
                element.style.flexGrow = factor; 
                
                if (isBar) {
                    element.className = 'barcode-line'; 
                } else {
                    element.className = 'barcode-space';
                }
                
                container.appendChild(element);
                isBar = !isBar; // 交替
            }
        }

        // 輔助函數：計算 Code 128 的校驗碼 (Checksum) - 保持不變 (保留原有)
        function calculateChecksum(data) {
            let sum = START_CODE_B; 
            
            for (let i = 0; i < data.length; i++) {
                // Code 128 B 的字符值 = ASCII 值 - 32
                const charCode = data.charCodeAt(i) - 32; 
                sum += (i + 1) * charCode;
            }
            
            const checksumValue = sum % 103;
            return checksumValue;
        }

        /**
         * 根據會員 ID 生成模擬 Code 128 條碼 (佈滿整個寬度)。 (保留原有)
         */
        function generateBarcode(memberId) {
            const barcodeElement = document.getElementById('memberBarcode');
            if (!barcodeElement) return;

            barcodeElement.innerHTML = ''; 
            
            // 1. 獲取校驗碼 (Checksum)
            const checksumValue = calculateChecksum(memberId);
            
            // 2. 繪製啟動碼 (Start Code B)
            drawPattern(CODE128_B_ENCODING[START_CODE_B], barcodeElement);
            
            // 3. 繪製數據碼
            for (let i = 0; i < memberId.length; i++) {
                const char = memberId[i];
                // Code B 值 (0-99) = ASCII 值 - 32
                const codeValue = char.charCodeAt(0) - 32; 
                
                // 檢查是否為有效字符，防止索引超出範圍
                if (codeValue >= 0 && codeValue <= 95) {
                    drawPattern(CODE128_B_ENCODING[codeValue], barcodeElement);
                }
            }
            
            // 4. 繪製校驗碼 (Checksum Code)
            drawPattern(CODE128_B_ENCODING[checksumValue], barcodeElement);
            
            // 5. 繪製停止碼 (Stop Code)
            const stopCodePattern = CODE128_B_ENCODING[STOP_CODE];
            drawPattern(stopCodePattern, barcodeElement);
            
            // 繪製最後的終止符黑條 (始終為 2 單位寬度)
            const terminator = document.createElement('span');
            terminator.className = 'barcode-line';
            terminator.style.flexGrow = 2; // 佔 2 個單位
            barcodeElement.appendChild(terminator);
        }


        /**
         * 填充頁面上的會員資料。
         */
        function populateMemberData(memberData) {
            document.getElementById('memberGreeting').textContent = `(Hi, ${memberData.name})`;
            document.getElementById('memberName').textContent = memberData.name;
            document.getElementById('memberEmail').textContent = memberData.email;
            document.getElementById('memberPhone').textContent = memberData.phone;
            document.getElementById('memberBirthday').textContent = memberData.birthday;
            document.getElementById('memberPoints').textContent = memberData.points.toLocaleString('en-US'); 
            document.getElementById('memberID').textContent = memberData.id;
            
            // 呼叫條碼生成函數
            generateBarcode(memberData.id); 
        }


        /**
         * 統一的通知顯示函數 (保留原有)
         */
        function showNotification(message, isError = false) {
            const notification = document.createElement('div');
            notification.innerHTML = message;
            // 成功用 Green (登出成功)，失敗/警告用 Red
            const bgColor = isError ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800';

            // 使用 fixed 定位和動畫 class
            notification.className = `fixed top-0 left-1/2 -translate-x-1/2 mt-4 px-6 py-3 rounded-lg shadow-xl z-50 transition duration-300 transform ${bgColor} animate-fade-in-down`;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.classList.replace('animate-fade-in-down', 'animate-fade-out-up');
                setTimeout(() => notification.remove(), 500); // 讓淡出動畫完成
            }, 3000); // 顯示 3 秒
        }

        /**
         * 檢查登入狀態：如果沒有 Token 則跳轉到登入頁。 (保留原有)
         */
        function checkLoginStatus() {
            const token = localStorage.getItem('auth_token');
            
            if (!token || !MEMBER_DB[token]) {
                document.body.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen bg-gray-50 text-gray-700">
                        <p class="text-xl p-10">您尚未登入，正在導向登入頁面...</p>
                        <div class="w-10 h-10 border-4 border-vieshow-red border-t-transparent border-solid rounded-full animate-spin"></div>
                    </div>
                `;
                window.location.href = LOGIN_PAGE_URL;
                return null;
            }
            return MEMBER_DB[token];
        }

        // --- 登出處理 (保留原有) ---
        document.getElementById('signOutButton').addEventListener('click', function(e) {
            e.preventDefault(); 

            // 禁用按鈕以防止重複點擊
            this.disabled = true; 
            this.textContent = '登出中...';

            // 1. 清除登入狀態的關鍵步驟
            localStorage.removeItem('auth_token'); 

            // 2. 顯示登出訊息 (使用彈跳框)
            showNotification('✅ 登出成功！即將導向首頁...', false);

            // 3. 替換 Header 導航為未登入狀態 (視覺更新)
            const headerNavRight = document.getElementById('headerNavRight');
            if (headerNavRight) {
                headerNavRight.innerHTML = `
                    <a href="${LOGIN_PAGE_URL}" class="hover:text-vieshow-gold transition duration-300">登入</a>
                    <a href="../auth/register.html" class="hover:text-vieshow-gold transition duration-300">註冊</a>
                `;
            }

            // 4. 延遲 2 秒後導向首頁
            setTimeout(() => {
                window.location.href = INDEX_
