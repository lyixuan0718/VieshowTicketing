<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘記密碼 - Vieshow Ticketing</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'vieshow-red': '#e50914',
                        'vieshow-gold': '#f7a83d',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="w-full max-w-sm">
        
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-vieshow-red">Vieshow</h1>
            <p class="text-gray-600 mt-1">威秀影城訂票系統</p>
        </div>

        <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl border-t-4 border-vieshow-red">
            <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">
                🔒 重設密碼
            </h2>
            <div id="messageContainer" class="hidden p-3 mb-4 rounded-lg font-medium text-sm text-center" role="alert"></div>
            
            <div id="step1_verification">
                <p class="text-center text-gray-500 mb-6 text-sm">請輸入您的帳號與身分證號進行驗證。</p>
                <form id="verificationForm" action="#" method="POST" class="space-y-4">
                    <div>
                        <label for="memberEmail" class="block text-sm font-medium text-gray-700 mb-1">電子郵件 (帳號):</label>
                        <input type="email" id="memberEmail" name="memberEmail" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-vieshow-red focus:border-vieshow-red transition duration-150" placeholder="您的註冊電子郵件">
                    </div>
                    <div>
                        <label for="memberId" class="block text-sm font-medium text-gray-700 mb-1">身分證字號:</label>
                        <input type="text" id="memberId" name="memberId" required maxlength="10" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-vieshow-red focus:border-vieshow-red transition duration-150" placeholder="請輸入身分證字號 (10碼)">
                    </div>
                    <button type="submit" id="step1Button" class="w-full bg-vieshow-red text-white py-3 rounded-lg font-bold text-base hover:bg-red-700 transition duration-200 shadow-md flex items-center justify-center">
                        驗證帳號
                    </button>
                </form>
            </div>

            <div id="step2_reset" class="hidden">
                <p class="text-center text-gray-500 mb-6 text-sm">請輸入並確認新的密碼。</p>
                <form id="resetPasswordForm" action="#" method="POST" class="space-y-4">
                    <div>
                        <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">新密碼 (英數組合，至少8碼):</label>
                        <input type="password" id="newPassword" name="newPassword" required minlength="8" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-vieshow-red focus:border-vieshow-red transition duration-150" placeholder="請輸入 8 位以上新密碼">
                        <span class="text-vieshow-red text-xs mt-1 block" id="newPwdFormatError"></span>
                    </div>
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">確認新密碼:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-vieshow-red focus:border-vieshow-red transition duration-150" placeholder="請再次輸入新密碼">
                        <span class="text-vieshow-red text-xs mt-1 block" id="newPwdMatchError"></span>
                    </div>
                    <button type="submit" id="step2Button" class="w-full bg-vieshow-red text-white py-3 rounded-lg font-bold text-base hover:bg-red-700 transition duration-200 shadow-md flex items-center justify-center">
                        確認更改密碼
                    </button>
                </form>
            </div>
            
            <p class="mt-6 text-center text-sm">
                <a href="login.html" class="text-blue-600 hover:text-blue-800 hover:underline transition duration-150">
                    &larr; 返回登入頁面
                </a>
            </p>
        </div>
    </div>

    <script>
        /**
         * 顯示表單操作訊息
         * @param {string} text - 內文
         * @param {string} type - 訊息類型 ('success', 'error', 'info')
         */
        function showFormMessage(text, type) {
            const container = document.getElementById('messageContainer');
            container.textContent = text;
            container.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-blue-100', 'text-blue-800');
            
            if (type === 'success') {
                container.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'error') {
                container.classList.add('bg-red-100', 'text-red-800');
            } else if (type === 'info') {
                 container.classList.add('bg-blue-100', 'text-blue-800');
            }

            // 5秒後自動隱藏
            setTimeout(() => {
                container.classList.add('hidden');
            }, 5000);
        }

        /**
         * 檢查密碼格式：英數組合且至少8個字元 (與註冊頁面統一)
         * @param {string} password - 密碼
         * @returns {string | null} - 錯誤訊息或 null (格式正確)
         */
        function checkPasswordFormat(password) {
            if (password.length < 8) {
                return '密碼長度必須至少 8 個字元。';
            }
            if (!/[a-zA-Z]/.test(password)) {
                return '密碼必須包含英文字母。';
            }
            if (!/[0-9]/.test(password)) {
                return '密碼必須包含數字。';
            }
            return null; // 格式正確
        }


        const step1 = document.getElementById('step1_verification');
        const step2 = document.getElementById('step2_reset');
        const verificationForm = document.getElementById('verificationForm');
        const resetForm = document.getElementById('resetPasswordForm');
        const step1Button = document.getElementById('step1Button');
        const step2Button = document.getElementById('step2Button');

        // 錯誤訊息元素
        const newPwdFormatError = document.getElementById('newPwdFormatError');
        const newPwdMatchError = document.getElementById('newPwdMatchError');
        
        // 清空所有內聯錯誤提示
        function clearResetErrors() {
            newPwdFormatError.textContent = '';
            newPwdMatchError.textContent = '';
        }
        
        // --- 步驟一：帳號驗證處理 (保持不變) ---
        verificationForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('memberEmail').value;
            const id = document.getElementById('memberId').value;
            
            // 由於這不是身分證格式驗證，只做長度檢查即可
            if (id.length !== 10) {
                showFormMessage('❌ 身分證字號長度必須是 10 碼。', 'error');
                return;
            }

            step1Button.disabled = true;
            step1Button.textContent = '驗證中...';
            step1Button.classList.add('opacity-75', 'cursor-not-allowed');
            showFormMessage('正在驗證您的帳號和身分資訊...', 'info');
            
            // 模擬異步 API 請求 (驗證)
            setTimeout(() => {
                // 假設成功條件：Email 為 test@vieshow.com 且身分證號為 A123456789
                const success = (email === 'test@vieshow.com' && id.toUpperCase() === 'A123456789'); 
                
                if (success) {
                    showFormMessage('✅ 帳號驗證成功！請設定您的新密碼。', 'success');
                    
                    // 切換到步驟二
                    step1.classList.add('hidden');
                    step2.classList.remove('hidden');
                } else {
                    // 模擬失敗回覆
                    showFormMessage('❌ 帳號或身分證字號不符，請確認輸入是否正確。', 'error');
                }

                step1Button.disabled = false;
                step1Button.textContent = '驗證帳號';
                step1Button.classList.remove('opacity-75', 'cursor-not-allowed');
            }, 2000); // 模擬 2 秒延遲
        });

        // --- 步驟二：重設密碼處理 (已修正) ---
        resetForm.addEventListener('submit', function(e) {
            e.preventDefault();

            clearResetErrors(); // 清空上次的錯誤提示

            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            // 1. 密碼格式檢查 (統一規則)
            const formatError = checkPasswordFormat(newPass);
            if (formatError) {
                newPwdFormatError.textContent = '❌ ' + formatError;
                showFormMessage('❌ 新密碼不符合格式要求。', 'error');
                return;
            }

            // 2. 密碼確認檢查
            if (newPass !== confirmPass) {
                newPwdMatchError.textContent = '❌ 兩次輸入的新密碼不一致，請重新確認。';
                showFormMessage('❌ 兩次輸入的新密碼不一致。', 'error');
                return;
            }

            // 驗證通過，執行提交
            step2Button.disabled = true;
            step2Button.textContent = '正在更改密碼...';
            step2Button.classList.add('opacity-75', 'cursor-not-allowed');

            showFormMessage('正在為您更新密碼，請稍候...', 'info');

            // 模擬異步 API 請求 (更新密碼)
            setTimeout(() => {
                // 假設更新密碼總是成功
                showFormMessage(`🎉 密碼已成功更新！您可以使用新密碼登入了。`, 'success');
                
                // 更改成功後，清空欄位並導向登入頁面 (模擬)
                resetForm.reset();
                step2Button.textContent = '已成功更改';
                
                // 模擬 2 秒後跳轉到登入頁面
                setTimeout(() => {
                    window.location.href = 'login.html'; // 假設登入頁面是 login.html
                }, 2000);
                
            }, 2000); // 模擬 2 秒延遲
        });
    </script>
    
</body>
</html>
